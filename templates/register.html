<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Register - Smart Medical Cabinet</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="container">
        {% with messages = get_flashed_messages() %}
        {% for msg in messages %}
        <div class="flash">{{ msg }}</div>
        {% endfor %}
        {% endwith %}

        <div class="login-box">
            <h2>Staff Registration</h2>
            <form method="POST">
                <label>Username</label>
                <input type="text" name="username" value="{{ form.get('username','') if form else '' }}" required
                    autofocus>
                <label>Password</label>
                <input type="password" name="password" required minlength="6">
                <label>Confirm Password</label>
                <input type="password" name="confirm_password" required minlength="6">
                <button class="btn" style="margin-top:14px;" type="submit">Create Account</button>
            </form>
            <p class="muted" style="margin-top:14px;">Already have an account? <a href="/login">Log in</a></p>
            <p class="muted">TODO: require admin to approve before register</p>
        </div>
    </div>

</body>

</html>
